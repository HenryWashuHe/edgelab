openapi: 3.1.0
info:
  title: EdgeLab Reliability Operations
  version: 3.2.0
  description: |
    Public monitoring read model and single-owner operator control plane.
    Laboratory endpoints are documented in LAB.md. No public probe or target-enrollment endpoint exists.
    All responses disable caching. Operations API browser Origins must match the API origin.
    Sampled-check budget signals are recorded by scheduled monitoring runs; public reads only age
    persisted evidence. Signals do not deliver notifications or change incident state.
servers:
  - url: https://edgelab-reliability.edgelab-henrywashuhe.workers.dev
  - url: http://localhost:8787
paths:
  /api/health:
    get:
      summary: Gateway health and version (not proof that monitoring is running)
      responses:
        '200':
          description: Worker is responding
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, colo, platform, origin]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  colo: { type: string }
                  platform: { type: string }
                  origin: { type: string }
  /api/ready:
    get:
      summary: Read-only readiness of autonomous monitoring
      description: |
        Ages persisted scheduler and current-revision service observations without renewing them.
        Returns 200 only when monitoring is healthy. Service probe outcomes do not determine
        readiness; an observed upstream failure can still prove that monitoring is running.
      responses:
        '200':
          description: Scheduler and expected active-service observations are fresh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '503':
          description: Monitoring is starting, partially observed, or stalled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '405': { $ref: '#/components/responses/Error' }
  /api/ops/status:
    get:
      summary: Public observations, metrics, and incident timeline
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
          description: Unrecognized values fall back to 24h.
      responses:
        '200':
          description: Public snapshot; excludes target URLs, notes, and credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusSnapshot' }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
  /api/ops/export:
    get:
      summary: Download a public monitoring report
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
      responses:
        '200':
          description: JSON attachment with the status snapshot, schemaVersion, exportedAt, and measurement methodology. Contains no private operator data.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment named edgelab-operations.json
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusSnapshot'
                  - type: object
                    required: [schemaVersion, exportedAt, measurement]
                    properties:
                      schemaVersion: { type: integer, const: 4 }
                      exportedAt: { type: string, format: date-time }
                      measurement: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
  /api/ops/incidents/{incidentId}:
    get:
      summary: Investigate incident observations, policy versions, and lifecycle
      description: |
        Anonymous requests receive public evidence. A valid bearer credential additionally
        includes progress notes and the acknowledgement note; those fields are absent from
        anonymous responses. A supplied invalid credential returns 401.
        Returns at most 50 checks in descending slot order. Pass nextCursor as before to seek
        the next page; the bound is exclusive and new recent observations do not shift older pages.
        Evidence covers ten minutes before detection through one minute after recovery, or the
        current minute for an open incident. Checks and progress notes retain at most 30 days.
        Missing historical policy versions are omitted, never reconstructed from the current policy.
      security: [{}, { operatorToken: [] }]
      parameters:
        - in: path
          name: incidentId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
          description: Exclusive Unix-minute cursor. Omit for the newest evidence page.
      responses:
        '200':
          description: Public incident evidence with private fields only for an authenticated operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
  /api/ops/incident-note:
    post:
      summary: Add a private progress note or postmortem to an active-target incident
      description: |
        Accepts open or resolved incidents belonging to a configured service. At most 100 retained
        progress notes are allowed per incident. A UUID v4 requestId identifies a retry: submitting
        the same incident and note returns the original note without a second audit event, including
        when the note limit has been reached. Reusing the requestId with changed content returns 409.
        Notes do not acknowledge or resolve an incident. Note text must contain a non-whitespace
        character and must be at most 500 UTF-16 code units. Bodies are limited to 4096 bytes.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incident, requestId, note]
              properties:
                incident: { type: string, format: uuid }
                requestId:
                  type: string
                  format: uuid
                  pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
                note: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
      responses:
        '201':
          description: New private note and one audit event recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentNoteResponse' }
        '200':
          description: Idempotent retry; original note returned with alreadyRecorded true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentNoteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409':
          description: requestId reused for a different payload, or incident already has 100 retained notes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/ops/audit:
    get:
      summary: Latest 100 audit records and private incident notes
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Private operator data; lifecycle audit actor is the deployment credential
          content:
            application/json:
              schema:
                type: object
                required: [events, incidents]
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, at, action, service, detail]
                      properties:
                        id: { type: integer }
                        at: { type: integer }
                        action: { type: string }
                        service: { type: string }
                        detail: { type: object }
                  incidents:
                    type: array
                    maxItems: 100
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Incident'
                        - type: object
                          properties:
                            note: { type: string, maxLength: 500 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
  /api/ops/policy:
    post:
      summary: Change policy with optimistic revision control
      description: Resets streaks and invalidates in-flight old-policy probes; preserves active incidents.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, revision, policy]
              properties:
                service: { type: string }
                revision: { type: integer, minimum: 1 }
                policy: { $ref: '#/components/schemas/PolicyPatch' }
      responses:
        '200':
          description: Updated policy revision
          content:
            application/json:
              schema:
                type: object
                required: [ok, revision]
                properties:
                  ok: { type: boolean }
                  revision: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/ops/acknowledge:
    post:
      summary: Acknowledge an open incident with a private investigation note
      description: Duplicate acknowledgements succeed without overwriting the first note. Does not resolve incidents.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incident, note]
              properties:
                incident: { type: string, format: uuid }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Acknowledgement recorded or already present
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  alreadyAcknowledged: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: Random deployment secret, not an identity JWT. Never send as a query parameter.
  responses:
    Error:
      description: |
        400 validation; 401 absent/invalid credential; 403 Origin mismatch;
        404 missing route/incident or removed service; 405 method with Allow header;
        409 revision/resolved conflict, changed note retry, or note limit;
        413 request body over 4096 bytes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    MonitoringReadiness:
      type: object
      required: [status, lastStartedAt, lastCompletedAt, lastSlot, ageMs, reason]
      properties:
        status: { type: string, enum: [starting, healthy, partial, stalled] }
        lastStartedAt: { type: [integer, 'null'], description: Scheduler start Unix milliseconds }
        lastCompletedAt:
          { type: [integer, 'null'], description: Scheduler completion Unix milliseconds }
        lastSlot: { type: [integer, 'null'], description: Last completed Unix minute number }
        ageMs: { type: [integer, 'null'], minimum: 0 }
        reason: { type: string }
    ReadinessResponse:
      type: object
      required: [ok, monitoring]
      properties:
        ok: { type: boolean }
        monitoring: { $ref: '#/components/schemas/MonitoringReadiness' }
    StatusSnapshot:
      type: object
      required:
        [
          version,
          now,
          window,
          retentionDays,
          cadenceSeconds,
          services,
          incidents,
          monitoring,
          scheduler,
        ]
      properties:
        version: { type: string }
        now: { type: integer, description: Unix milliseconds }
        window: { type: string, enum: [24h, 7d] }
        retentionDays: { type: integer, const: 30 }
        cadenceSeconds: { type: integer, const: 60 }
        services:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Service' }
        incidents:
          type: array
          maxItems: 105
          description: All active open incidents, followed by the newest 100 active resolved incidents.
          items: { $ref: '#/components/schemas/Incident' }
        monitoring: { $ref: '#/components/schemas/MonitoringReadiness' }
        scheduler:
          type: array
          maxItems: 20
          items:
            type: object
            required: [at, slot, status, detail]
            properties:
              at: { type: integer, description: Unix milliseconds }
              slot: { type: integer }
              status: { type: string, enum: [started, completed, skipped-late] }
              detail: { type: object }
    PolicyPatch:
      type: object
      additionalProperties: false
      description: Partial update; latencyObjectiveMs must not exceed timeoutMs after merging.
      properties:
        paused: { type: boolean }
        timeoutMs: { type: integer, minimum: 100, maximum: 10000 }
        latencyObjectiveMs: { type: integer, minimum: 50, maximum: 10000 }
        availabilityTarget:
          type: number
          minimum: 90
          maximum: 99.99
          description: Good-check objective, including validity and latency.
        failureThreshold: { type: integer, minimum: 1, maximum: 10 }
        recoveryThreshold: { type: integer, minimum: 1, maximum: 10 }
    Check:
      type: object
      required: [service, slot, at, outcome, status, latency, revision, observedAt]
      properties:
        service: { type: string }
        slot: { type: integer, description: Unix minute number }
        at: { type: integer, description: Completion Unix milliseconds }
        observedAt:
          type: [integer, 'null']
          description: Observation start Unix milliseconds. Null for legacy checks whose timing cannot be verified.
        outcome:
          {
            type: string,
            enum: [good, http-error, timeout, network-error, invalid-body, slow, maintenance],
          }
        status: { type: [integer, 'null'] }
        latency: { type: integer, minimum: 0 }
        revision: { type: integer }
    Incident:
      type: object
      required: [id, service, opened, resolved, acknowledged]
      properties:
        id: { type: string, format: uuid }
        service: { type: string }
        opened: { type: integer, description: Detection Unix milliseconds }
        resolved: { type: [integer, 'null'] }
        acknowledged: { type: [integer, 'null'] }
    IncidentPolicyVersion:
      type: object
      required: [service, revision, recordedAt, name, transport, assertion, policy, provenance]
      properties:
        service: { type: string }
        revision: { type: integer }
        recordedAt: { type: integer, description: Version capture Unix milliseconds }
        name: { type: string }
        transport: { type: string, enum: [origin, https] }
        assertion: { type: string, enum: [ok-json, catalog-json] }
        policy: { $ref: '#/components/schemas/PolicyPatch' }
        provenance:
          type: string
          enum: [recorded, recovered-current]
          description: recorded captures a creation/change; recovered-current captures the current policy during upgrade and does not establish its historical capture time.
    IncidentNote:
      type: object
      required: [id, at, note]
      properties:
        id: { type: string, format: uuid }
        at: { type: integer, description: Note creation Unix milliseconds }
        note: { type: string, minLength: 1, maxLength: 500 }
    IncidentNoteResponse:
      type: object
      required: [ok, note]
      properties:
        ok: { type: boolean, const: true }
        note: { $ref: '#/components/schemas/IncidentNote' }
        alreadyRecorded: { type: boolean, const: true }
    IncidentDetail:
      type: object
      required: [incident, checks, nextCursor, versions, range, lifecycle]
      properties:
        incident: { $ref: '#/components/schemas/Incident' }
        checks:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Check' }
        nextCursor:
          type: [integer, 'null']
          minimum: 0
          description: Exclusive before cursor for the next older page, or null at the end.
        versions:
          type: array
          description: Immutable versions for revisions on this page; unavailable revisions are omitted.
          items: { $ref: '#/components/schemas/IncidentPolicyVersion' }
        range:
          type: object
          required: [fromSlot, toSlot, retentionStart, limitedByRetention]
          properties:
            fromSlot:
              { type: integer, description: Inclusive earliest retained incident evidence minute }
            toSlot: { type: integer, description: Inclusive incident evidence end minute }
            retentionStart: { type: integer, description: Retention boundary Unix milliseconds }
            limitedByRetention: { type: boolean }
        lifecycle:
          type: array
          maxItems: 3
          items:
            type: object
            required: [action, at]
            properties:
              action:
                type: string
                enum: [incident.opened, incident.acknowledged, incident.recovered]
              at: { type: integer, description: Event Unix milliseconds }
        notes:
          type: array
          maxItems: 100
          description: Private progress/postmortem notes; present only with a valid operator credential.
          items: { $ref: '#/components/schemas/IncidentNote' }
        acknowledgementNote:
          type: string
          maxLength: 500
          description: Private original acknowledgement note; present only with a valid operator credential.
    BudgetSignalSnapshot:
      type: object
      required: [evaluation, evaluationStatus, lastFiring]
      description: |
        Latest persisted sampled-check evaluation and retained historical warning evidence.
        Only current evaluations establish present signal confidence: the stored revision must
        match the service policy, and evaluation age must be between zero and 180000 milliseconds
        inclusive. Stale or changed-policy results remain inspectable but cannot establish clearance.
        Reads never recompute an evaluation or renew its timestamp. Signals neither send external
        notifications nor open, acknowledge, or resolve monitoring incidents.
      properties:
        evaluation:
          oneOf:
            - $ref: '#/components/schemas/BurnRateEvaluation'
            - type: 'null'
        evaluationStatus:
          type: string
          enum: [current, stale, policy-changed, not-evaluated]
        lastFiring:
          description: Preserved through clear, insufficient evidence, maintenance, and policy changes. Null until a qualified rule first fires.
          oneOf:
            - $ref: '#/components/schemas/BudgetFiringEvidence'
            - type: 'null'
    BurnRateEvaluation:
      type: object
      required: [ruleVersion, revision, computedAt, state, highestFiring, rules]
      description: |
        Evaluates finished UTC minutes under the current policy revision, using at most the latest
        4320 minutes. Only checks with a verified observation timestamp in their scheduled minute
        count. Fixed paired thresholds use a 30-day sampled-check budget basis: rapid 60m/5m at
        14.4x, sustained 360m/30m at 6x, and gradual 4320m/360m at 1x. These are probe signals,
        not customer-request availability or geographically independent uptime measurements.
      properties:
        ruleVersion: { type: integer, const: 1 }
        revision: { type: integer, minimum: 1 }
        computedAt: { type: integer, description: Scheduled evaluation Unix milliseconds }
        state:
          type: string
          enum: [firing, clear, insufficient-evidence, maintenance]
        highestFiring:
          type: [string, 'null']
          enum: [rapid, sustained, gradual, null]
          description: Highest-priority qualified firing rule, or null. Priority is rapid, sustained, then gradual.
        rules:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/BurnRuleEvidence' }
    BurnRuleEvidence:
      type: object
      required: [id, name, long, short, threshold, state, reason]
      description: |
        Both windows must fall fully within the current policy's history, have at least 95% verified
        coverage, and contain at least twenty long-window and five short-window non-maintenance
        observations. A firing rule meets its threshold in both windows. Clear requires qualified
        evidence; unknown or immature windows produce insufficient-evidence instead.
      properties:
        id: { type: string, enum: [rapid, sustained, gradual] }
        name: { type: string }
        long: { $ref: '#/components/schemas/BurnWindowEvidence' }
        short: { $ref: '#/components/schemas/BurnWindowEvidence' }
        threshold: { type: number, minimum: 0 }
        state:
          type: string
          enum: [firing, clear, insufficient-evidence, maintenance]
        reason: { type: string }
    BurnWindowEvidence:
      type: object
      required:
        [
          minutes,
          startSlot,
          endSlot,
          expected,
          observed,
          good,
          bad,
          maintenance,
          unknown,
          coverage,
          burnRate,
          mature,
        ]
      properties:
        minutes: { type: integer, minimum: 1 }
        startSlot: { type: integer, description: Inclusive first Unix minute }
        endSlot: { type: integer, description: Inclusive last finished Unix minute }
        expected: { type: integer, minimum: 1 }
        observed: { type: integer, minimum: 0, description: Verified good plus bad observations }
        good: { type: integer, minimum: 0 }
        bad: { type: integer, minimum: 0 }
        maintenance: { type: integer, minimum: 0 }
        unknown:
          type: integer
          minimum: 0
          description: Missing, legacy, mistimed, or different-policy slots; no success credit.
        coverage:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Percentage of eligible minutes observed; maintenance is excluded from the denominator.
        burnRate:
          type: [number, 'null']
          minimum: 0
          description: Observed bad fraction divided by the current policy's allowed bad fraction; null with no observations.
        mature:
          type: boolean
          description: Entire window starts at or after the first complete minute of the current policy.
    BudgetFiringEvidence:
      type: object
      required: [firstFiredAt, lastConfirmedAt, revision, rule, evidence]
      description: |
        Last qualified highest-priority warning, retained even when later evidence cannot confirm
        its state. First-fired time continues only while the previous evaluation is current and
        firing under the same revision and highest rule. Clear, insufficient evidence, changed
        policy/rule, or stale evaluation starts a new confirmed interval on subsequent firing.
        These timestamps describe evaluations; they are not outage or incident timestamps.
      properties:
        firstFiredAt:
          {
            type: integer,
            description: First evaluation Unix milliseconds in the confirmed interval,
          }
        lastConfirmedAt:
          { type: integer, description: Most recent qualified firing evaluation Unix milliseconds }
        revision: { type: integer, minimum: 1 }
        rule: { type: string, description: Retained firing rule identifier }
        evidence: { $ref: '#/components/schemas/BurnRuleEvidence' }
    Service:
      type: object
      required:
        [
          id,
          name,
          transport,
          assertion,
          createdAt,
          revision,
          policy,
          latest,
          status,
          state,
          budget,
          metrics,
          history,
          hourly,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string, enum: [origin, https] }
        assertion: { type: string, enum: [ok-json, catalog-json] }
        createdAt: { type: integer }
        revision: { type: integer }
        policy: { $ref: '#/components/schemas/PolicyPatch' }
        latest:
          oneOf:
            - $ref: '#/components/schemas/Check'
            - type: 'null'
        status: { type: string, enum: [healthy, degraded, incident, unknown, maintenance] }
        state:
          type: object
          properties:
            failures: { type: integer }
            successes: { type: integer }
            lastSlot: { type: [integer, 'null'] }
            incidentId: { type: [string, 'null'] }
        budget: { $ref: '#/components/schemas/BudgetSignalSnapshot' }
        metrics:
          type: object
          description: Finished minutes only; legacy checks without observedAt are unverified and excluded from observed/good/maintenance/P95. Null ratios when denominators are zero. Budget uses current target; outcomes use original policy.
          properties:
            total: { type: integer }
            observed: { type: integer }
            good: { type: integer }
            maintenance: { type: integer }
            unverified: { type: integer }
            expected: { type: integer }
            missing: { type: integer }
            coverage: { type: [number, 'null'] }
            goodRatio: { type: [number, 'null'] }
            p95Ms: { type: [number, 'null'] }
            budgetConsumed: { type: [number, 'null'] }
            windowStart: { type: integer }
            windowEnd: { type: integer }
        history:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/Check' }
        hourly:
          type: array
          items:
            type: object
            properties:
              at: { type: integer }
              total: { type: integer }
              good: { type: integer }
              maintenance: { type: integer }
              unverified: { type: integer }
