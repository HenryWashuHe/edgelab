openapi: 3.1.0
info:
  title: EdgeLab Reliability Operations
  version: 3.9.0
  description: |
    Public monitoring read model and single-owner operator control plane.
    HTTP laboratory controls are documented in LAB.md; the observer upgrade and message schema are below.
    This describes deployed 3.9.0, preserving the additive 3.7.0 view contract.
    Native owner/observer admission runs before lab object lookup; refusal has no engine outcome or source event.
    Scoped local verification is recorded in docs/evidence/VALIDATION.md and
    docs/evidence/releases/3.9.0-lab-admission.json. Full implementation CI passes; live acceptance,
    asset identity, autonomous monitoring and privacy checks are in docs/evidence/releases/3.9.0-live-monitoring.json.
    Exact production thresholds, SQL/CPU/billing and rendered browser validation are not claimed.
    Historical 3.6.0 recording, 3.7.0 status-cache and 3.8.0 live evidence remain distinct.
    Bounded browser recording and the offline #replay view add no API endpoint or socket command.
    Recordings retain at most 256 entries and 196608 UTF-8 bytes in memory, with 1024 bytes reserved
    for finalization. Stop freezes the valid prefix while live observation may continue; Download
    exports it. Replay reads no capability, makes no application API requests or WebSocket messages,
    persists nothing automatically and executes no experiment. Server and recorder clocks differ;
    gaps stay unknown. The unsigned SHA-256 detects changes, not authenticity, a full backup or reexecution.
    No public probe or target-enrollment endpoint exists.
    HTTP responses disable client/CDN caching with no-store. Only the public status view may use
    bounded instance memory reuse; export, readiness, incident detail, audit, brief and laboratory
    routes bypass it. Operations API browser Origins must match the API origin.
    Sampled-check budget signals are recorded by scheduled monitoring runs; public reads only age
    persisted evidence. Signals do not deliver notifications or change incident state.
servers:
  - url: https://edgelab-reliability.edgelab-henrywashuhe.workers.dev
  - url: http://localhost:8787
paths:
  /api/health:
    get:
      summary: Gateway health and version (not proof that monitoring is running)
      responses:
        '200':
          description: Worker is responding
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, colo, platform, origin]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  colo: { type: string }
                  platform: { type: string }
                  origin: { type: string }
  /api/observe:
    get:
      summary: Read-only WebSocket observation of an existing synthetic lab
      description: |
        Requires a same-origin browser handshake, no query parameters and exactly two offered
        subprotocols in order: edgelab-observer-v1, edgelab-cap.<UUID-v4>. The capability retains
        authority over the HTTP lab controls; this interface is not a separate authorization role.
        The server selects only edgelab-observer-v1. At most four observers attach to one run.
        Attachment, reconnect and idle sockets never initialize state, renew the lease or set alarms.
        A snapshot contains up to twelve outcomes; each update contains at most one. Frames are
        allowlisted and bounded to 16384 encoded bytes. Tokens are committed, not estimated refill.
        Legacy metadata is revision zero with null committedAt in a snapshot only. New writes have
        positive revisions and an actual commit timestamp. Reset changes runId and advances revision.
        After handshake validation, a separate location-scoped native observer admission lane runs
        before any lab namespace lookup. A gateway admission refusal contains no frame or source event
        and cannot renew the lease. Native policies are approximate; fixed Retry-After60 advice is not
        an exact counter reset or assurance of acceptance. Owner routes use a separate lane.
        No commands, application heartbeat or polling timer exist. Every incoming application message
        closes the socket: 1008 for read-only violation, 1009 above the byte bound. Known idle expiry
        sends an expired terminal frame and closes 4001. Handled storage failures attempt a sanitized
        unavailable frame and close 1011; failures inside the concurrency block can reset the object
        and interrupt the connection without that frame. Browser upgrade failures and interruptions
        may be opaque and cannot identify a specific HTTP cause. Natural TCP shutdown timing is not
        established by local tests; received close codes and application membership are verified.
      x-websocket-message-schema:
        $ref: '#/components/schemas/LabObserverFrame'
      parameters:
        - in: header
          name: Origin
          required: true
          description: Must equal the request URL origin.
          schema: { type: string, format: uri }
        - in: header
          name: Upgrade
          required: true
          schema: { type: string, enum: [websocket] }
        - in: header
          name: Sec-WebSocket-Protocol
          required: true
          description: The ordered version/capability pair; optional surrounding whitespace is trimmed.
          schema: { type: string, maxLength: 128 }
      responses:
        '101':
          description: WebSocket accepted; message schema is the x-websocket-message-schema extension, not an HTTP JSON body.
          headers:
            Sec-WebSocket-Protocol:
              schema: { type: string, const: edgelab-observer-v1 }
            Cache-Control:
              schema: { type: string, const: no-store }
        '400':
          description: Query parameters or missing, malformed, oversized, extra or out-of-order protocols.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing or mismatched Origin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No existing source run; observation cannot create one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '410':
          description: The existing run has passed its idle deadline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '426':
          description: WebSocket Upgrade required.
          headers:
            Upgrade:
              schema: { type: string, const: websocket }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Native admission refused before lab lookup, or four observers already attached. Existing clients are not displaced. Only native refusal supplies fixed Retry-After60 advice.
          headers:
            Retry-After:
              description: Present on native admission refusal only; fixed backoff advice, not an exact reset time.
              schema: { type: string, const: '60' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/LabAdmissionFailure'
        '503':
          description: Native admission unavailable before lab lookup, or deadline/projection/storage unavailable after dispatch. Current state is unconfirmed.
          headers:
            Retry-After:
              description: Present on native admission and sanitized storage failures; deadline or projection errors may omit it. Fixed backoff advice.
              schema: { type: string, const: '60' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/LabStorageUnavailable'
                  - $ref: '#/components/schemas/LabAdmissionFailure'
  /api/ready:
    get:
      summary: Read-only readiness of autonomous monitoring
      description: |
        Ages persisted scheduler and current-revision service observations without renewing them.
        Returns 200 only when monitoring is healthy. Service probe outcomes do not determine
        readiness; an observed upstream failure can still prove that monitoring is running.
        Bypasses public status reuse and reads authoritative storage. It does not initiate a probe.
      responses:
        '200':
          description: Scheduler and expected active-service observations are fresh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '503':
          description: Monitoring is starting, partially observed, stalled, or storage cannot be read
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ReadinessResponse'
                  - $ref: '#/components/schemas/MonitoringUnavailable'
        '405': { $ref: '#/components/responses/Error' }
  /api/ops/status:
    get:
      summary: Public observations, metrics, and incident timeline
      description: |
        Version 3.7.0 may reuse either canonical reporting window within the same UTC minute,
        for an exact age below 10000 milliseconds and unchanged configuration/mutation context.
        At most two windows share a 1048576-byte serialized UTF-8 envelope cap, including private
        budget-row revision/time sources used for aging but excluded from responses. This is not
        a JavaScript heap bound; oversized views remain complete and uncached. A valid bearer
        credential does not add private data or bypass reuse. Relevant commits and observed
        monitor failures clear the views; a success is never reused as an error fallback.
        A zero-read hit can mask an as-yet-unobserved storage failure for less than ten seconds.
        Optional read provenance distinguishes original materialization from delivery. Response
        now equals servedAt; observation, evaluation, warning, incident, scheduler and cleanup
        timestamps remain unchanged. Service status, budget freshness and monitoring readiness
        age against delivery time. Missing/invalid legacy provenance cannot establish a fresh read.
        HTTP Cache-Control remains no-store. Use readiness or export for an authoritative read.
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
          description: Unrecognized values fall back to 24h.
      responses:
        '200':
          description: Public snapshot; excludes target URLs, notes, and credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusSnapshot' }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/export:
    get:
      summary: Download a public monitoring report
      description: |
        Bypasses public status reuse through a distinct internal route and materializes the complete
        report from authoritative storage. When read provenance is present, source is storage,
        materializedAt equals servedAt and now, and ageMs is zero. Reading never initiates a probe
        or renews actual observation/evaluation timestamps. A storage failure returns JSON503
        without a download attachment or cached success.
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
      responses:
        '200':
          description: JSON attachment with the status snapshot, schemaVersion, exportedAt, and measurement methodology. Contains no private operator data.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment named edgelab-operations.json
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatusSnapshot'
                  - type: object
                    required: [schemaVersion, exportedAt, measurement]
                    properties:
                      schemaVersion: { type: integer, const: 4 }
                      exportedAt: { type: string, format: date-time }
                      measurement: { type: string }
                      read:
                        allOf:
                          - $ref: '#/components/schemas/StatusViewRead'
                          - type: object
                            properties:
                              source: { const: storage }
                              ageMs: { const: 0 }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/incidents/{incidentId}:
    get:
      summary: Investigate incident observations, policy versions, and lifecycle
      description: |
        Anonymous requests receive public evidence. A valid bearer credential additionally
        includes progress notes and the acknowledgement note; those fields are absent from
        anonymous responses. A supplied invalid credential returns 401.
        Returns at most 50 checks in descending slot order. Pass nextCursor as before to seek
        the next page; the bound is exclusive and new recent observations do not shift older pages.
        Evidence covers ten minutes before detection through one minute after recovery, or the
        current minute for an open incident. Checks and progress notes retain at most 30 days.
        Missing historical policy versions are omitted, never reconstructed from the current policy.
      security: [{}, { operatorToken: [] }]
      parameters:
        - in: path
          name: incidentId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
          description: Exclusive Unix-minute cursor. Omit for the newest evidence page.
      responses:
        '200':
          description: Public incident evidence with private fields only for an authenticated operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/incident-note:
    post:
      summary: Add a private progress note or postmortem to an active-target incident
      description: |
        Accepts open or resolved incidents belonging to a configured service. At most 100 retained
        progress notes are allowed per incident. A UUID v4 requestId identifies a retry: submitting
        the same incident and note returns the original note without a second audit event, including
        when the note limit has been reached. Reusing the requestId with changed content returns 409.
        Notes do not acknowledge or resolve an incident. Note text must contain a non-whitespace
        character and must be at most 500 UTF-16 code units. Bodies are limited to 4096 bytes.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incident, requestId, note]
              properties:
                incident: { type: string, format: uuid }
                requestId:
                  type: string
                  format: uuid
                  pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
                note: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
      responses:
        '201':
          description: New private note and one audit event recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentNoteResponse' }
        '200':
          description: Idempotent retry; original note returned with alreadyRecorded true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentNoteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409':
          description: requestId reused for a different payload, or incident already has 100 retained notes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/incident-brief:
    post:
      summary: Generate a private evidence-grounded investigation brief
      description: |
        Freezes the newest public-safe incident evidence page and its SHA-256 hash; private notes,
        targets and credentials are excluded from inference. Deterministic facts are separate from
        AI hypotheses, which remain unverified even with valid citations. Requires an enabled AI
        capability. Four inference attempts per UTC day, one start per UTC minute, one pending call,
        and a 20-second deadline apply. No cron generation, automatic retry, model fallback or action execution.
        Reuse the same UUID after a lost response: it retrieves the frozen request without dispatching
        again. A failed/interrupted request is terminal; a new deliberate attempt needs a new UUID.
        Records expire 30 days after creation and are absent from public status, export and incident detail.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [incident, requestId]
              properties:
                incident: { type: string, format: uuid }
                requestId:
                  type: string
                  format: uuid
                  pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      responses:
        '201':
          description: New complete brief, or deterministic insufficient evidence without inference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefResponse' }
        '200':
          description: Retained terminal request; no new inference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefResponse' }
        '202':
          description: This request already owns a pending inference; retrieve using GET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422':
          description: Model-input preparation failure retained without dispatch, or new frozen record exceeds the storage byte limit with no row or attempt created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefError' }
        '429':
          description: Inference quota, pending-call gate or record admission limit; no new record or dispatch reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefError' }
        '502':
          description: Provider or validation failure; retained sanitized result when available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefError' }
        '503':
          description: AI capability/provider failure, or monitoring storage unavailable
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/BriefError'
                  - $ref: '#/components/schemas/MonitoringUnavailable'
  /api/ops/incident-briefs/{requestId}:
    get:
      summary: Retrieve the frozen private request without inference
      security: [{ operatorToken: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Retained terminal request; an expired dispatch is interrupted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefResponse' }
        '202':
          description: Retained pending request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/incidents/{incidentId}/briefs:
    get:
      summary: Latest five private requests, capability, inference quota and record admission
      security: [{ operatorToken: [] }]
      parameters:
        - in: path
          name: incidentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capability can be disabled while retained records remain readable
          content:
            application/json:
              schema:
                type: object
                required: [capability, records, quota, admission]
                properties:
                  capability: { type: string, enum: [enabled, disabled] }
                  records:
                    type: array
                    maxItems: 5
                    items: { $ref: '#/components/schemas/BriefRecord' }
                  quota: { $ref: '#/components/schemas/BriefQuota' }
                  admission: { $ref: '#/components/schemas/BriefAdmission' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/audit:
    get:
      summary: Latest 100 audit records, private incident notes and latest completed cleanup
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Private operator data; lifecycle audit actor is the deployment credential
          content:
            application/json:
              schema:
                type: object
                required: [events, incidents, lastCleanup]
                properties:
                  lastCleanup:
                    oneOf:
                      - $ref: '#/components/schemas/CleanupRecord'
                      - type: 'null'
                    description: Latest retained completed run, read with one indexed query. Null when absent; a legacy or malformed receipt has cleanup null. Reads never renew this timestamp.
                  events:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, at, action, service, detail]
                      properties:
                        id: { type: integer }
                        at: { type: integer }
                        action: { type: string }
                        service: { type: string }
                        detail: { type: object }
                  incidents:
                    type: array
                    maxItems: 100
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Incident'
                        - type: object
                          properties:
                            note: { type: string, maxLength: 500 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/policy:
    post:
      summary: Change policy with optimistic revision control
      description: Resets streaks and invalidates in-flight old-policy probes; preserves active incidents.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, revision, policy]
              properties:
                service: { type: string }
                revision: { type: integer, minimum: 1 }
                policy: { $ref: '#/components/schemas/PolicyPatch' }
      responses:
        '200':
          description: Updated policy revision
          content:
            application/json:
              schema:
                type: object
                required: [ok, revision]
                properties:
                  ok: { type: boolean }
                  revision: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
  /api/ops/acknowledge:
    post:
      summary: Acknowledge an open incident with a private investigation note
      description: Duplicate acknowledgements succeed without overwriting the first note. Does not resolve incidents.
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incident, note]
              properties:
                incident: { type: string, format: uuid }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Acknowledgement recorded or already present
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  alreadyAcknowledged: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MonitoringUnavailable' }
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: Random deployment secret, not an identity JWT. Never send as a query parameter.
  responses:
    MonitoringUnavailable:
      description: Storage cannot be read. No successful snapshot or readiness is asserted; original provider exceptions remain private.
      headers:
        Retry-After:
          {
            schema: { type: string },
            description: Sixty seconds; explicit refresh remains possible,
          }
        Date:
          { schema: { type: string }, description: Server response time for quota-reset backoff }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MonitoringUnavailable' }
    Error:
      description: |
        400 validation; 401 absent/invalid credential; 403 Origin mismatch;
        404 missing route/incident or removed service; 405 method with Allow header;
        409 revision/resolved conflict, changed note retry, or note limit;
        413 request body over 4096 bytes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    LabObserverTimestamp:
      type: integer
      minimum: 0
      maximum: 8640000000000000
      description: Safe renderable Unix milliseconds; never supplied by the browser.
    LabAdmissionFailure:
      type: object
      additionalProperties: false
      required: [error, code, retryAfterSeconds]
      description: |
        HTTP429 limited or HTTP503 unavailable; returned before any lab namespace lookup.
        This request was not forwarded. Earlier or sibling requests may have committed.
        No engine outcome, event, request ID or source state is fabricated. Retry advice is not a reset deadline.
      properties:
        error: { type: string, minLength: 1 }
        code: { type: string, enum: [lab-admission-limited, lab-admission-unavailable] }
        retryAfterSeconds: { type: integer, const: 60 }
    LabStorageUnavailable:
      type: object
      additionalProperties: false
      required: [error, code, reason, retryAtUTC]
      properties:
        error: { type: string }
        code: { type: string, const: lab-storage-unavailable }
        reason: { type: string, enum: [daily-read-limit, daily-write-limit, storage-unavailable] }
        retryAtUTC: { type: [string, 'null'], format: date-time }
    LabObserverFrame:
      oneOf:
        - $ref: '#/components/schemas/LabObserverDataFrame'
        - $ref: '#/components/schemas/LabObserverTerminalFrame'
    LabObserverTerminalFrame:
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, reason, now]
      properties:
        schemaVersion: { type: integer, const: 1 }
        kind: { type: string, enum: [expired, unavailable] }
        reason: { type: string, enum: [idle-expired, lab-unavailable] }
        now: { $ref: '#/components/schemas/LabObserverTimestamp' }
      allOf:
        - if:
            properties:
              kind: { const: expired }
          then:
            properties:
              reason: { const: idle-expired }
          else:
            properties:
              reason: { const: lab-unavailable }
    LabObserverDataFrame:
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, runId, revision, committedAt, now, expiresAt, state, events]
      description: |
        expiresAt must be later than now; committedAt and event times must not be in the future.
        Zero revision is legacy snapshot-only with null committedAt. Positive revision requires
        nonnull committedAt. Each event ID is unique. Pending equals total minus the sum of counts.
      properties:
        schemaVersion: { type: integer, const: 1 }
        kind: { type: string, enum: [snapshot, update] }
        runId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        committedAt:
          oneOf:
            - $ref: '#/components/schemas/LabObserverTimestamp'
            - { type: 'null' }
        now: { $ref: '#/components/schemas/LabObserverTimestamp' }
        expiresAt: { $ref: '#/components/schemas/LabObserverTimestamp' }
        state: { $ref: '#/components/schemas/LabObserverState' }
        events:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/LabObserverEvent' }
      allOf:
        - if:
            properties:
              kind: { const: update }
          then:
            properties:
              events: { maxItems: 1 }
        - if:
            properties:
              revision: { const: 0 }
          then:
            properties:
              kind: { const: snapshot }
              committedAt: { type: 'null' }
          else:
            properties:
              committedAt: { $ref: '#/components/schemas/LabObserverTimestamp' }
    LabObserverState:
      type: object
      additionalProperties: false
      required: [config, tokens, circuit, failures, total, originCalls, counts]
      description: Tokens must not exceed capacity; originCalls and summed outcome counts must not exceed total.
      properties:
        config:
          type: object
          additionalProperties: false
          required:
            [
              capacity,
              refillPerSecond,
              failureThreshold,
              cooldownMs,
              originLatencyMs,
              originTimeoutMs,
              staleFallback,
              originMode,
            ]
          properties:
            capacity: { type: integer, minimum: 1, maximum: 50 }
            refillPerSecond: { type: integer, minimum: 1, maximum: 20 }
            failureThreshold: { type: integer, minimum: 1, maximum: 10 }
            cooldownMs: { type: integer, minimum: 1000, maximum: 15000 }
            originLatencyMs: { type: integer, minimum: 20, maximum: 3000 }
            originTimeoutMs: { type: integer, minimum: 100, maximum: 5000 }
            staleFallback: { type: boolean }
            originMode: { type: string, enum: [healthy, failing, flaky] }
        tokens: { type: number, minimum: 0, maximum: 50 }
        circuit: { type: string, enum: [closed, open, half-open] }
        failures: { type: integer, minimum: 0, maximum: 9007199254740991 }
        total: { type: integer, minimum: 0, maximum: 9007199254740991 }
        originCalls: { type: integer, minimum: 0, maximum: 9007199254740991 }
        counts:
          type: object
          additionalProperties: false
          required: [origin, stale, limited, blocked, error]
          properties:
            origin: { type: integer, minimum: 0, maximum: 9007199254740991 }
            stale: { type: integer, minimum: 0, maximum: 9007199254740991 }
            limited: { type: integer, minimum: 0, maximum: 9007199254740991 }
            blocked: { type: integer, minimum: 0, maximum: 9007199254740991 }
            error: { type: integer, minimum: 0, maximum: 9007199254740991 }
    LabObserverEvent:
      type: object
      additionalProperties: false
      required: [id, at, latencyMs, outcome, status, circuit, originAttempted]
      properties:
        id: { type: integer, minimum: 1, maximum: 9007199254740991 }
        at: { $ref: '#/components/schemas/LabObserverTimestamp' }
        latencyMs: { type: number, minimum: 0 }
        outcome: { type: string, enum: [origin, stale, limited, blocked, error] }
        status: { type: integer, minimum: 100, maximum: 599 }
        circuit: { type: string, enum: [closed, open, half-open] }
        originAttempted: { type: boolean }
    MonitoringUnavailable:
      type: object
      required: [error, code, reason, retryAtUTC]
      additionalProperties: false
      properties:
        error: { type: string }
        code: { type: string, const: monitor-storage-unavailable }
        reason: { type: string, enum: [daily-read-limit, daily-write-limit, storage-unavailable] }
        retryAtUTC:
          {
            type: [string, 'null'],
            format: date-time,
            description: Next midnight UTC only when a Free-plan daily row limit was identified; otherwise null,
          }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    MonitoringReadiness:
      type: object
      required: [status, lastStartedAt, lastCompletedAt, lastSlot, ageMs, reason]
      properties:
        status: { type: string, enum: [starting, healthy, partial, stalled] }
        lastStartedAt: { type: [integer, 'null'], description: Scheduler start Unix milliseconds }
        lastCompletedAt:
          { type: [integer, 'null'], description: Scheduler completion Unix milliseconds }
        lastSlot: { type: [integer, 'null'], description: Last completed Unix minute number }
        ageMs: { type: [integer, 'null'], minimum: 0 }
        reason: { type: string }
    ReadinessResponse:
      type: object
      required: [ok, monitoring]
      properties:
        ok: { type: boolean }
        monitoring: { $ref: '#/components/schemas/MonitoringReadiness' }
    StatusViewRead:
      type: object
      additionalProperties: false
      required: [source, materializedAt, servedAt, ageMs, maxAgeMs]
      description: |
        Additive 3.7.0 view provenance. All times are renderable Unix milliseconds.
        Storage has materializedAt == servedAt == response now and ageMs == 0. Memory has
        servedAt == response now, ageMs == servedAt - materializedAt below 10000, and both
        times in the same UTC minute. This is view timing, not a renewed source observation
        or proof of fresh storage availability. Older responses may omit it.
      properties:
        source: { type: string, enum: [storage, memory] }
        materializedAt:
          type: integer
          minimum: 0
          maximum: 8640000000000000
          description: Original storage materialization time.
        servedAt:
          type: integer
          minimum: 0
          maximum: 8640000000000000
          description: Delivery time; equals response now.
        ageMs: { type: integer, minimum: 0, maximum: 9999 }
        maxAgeMs: { type: integer, const: 10000 }
      allOf:
        - if:
            properties:
              source: { const: storage }
          then:
            properties:
              ageMs: { const: 0 }
    StatusSnapshot:
      type: object
      required:
        [
          version,
          now,
          window,
          retentionDays,
          cadenceSeconds,
          services,
          incidents,
          monitoring,
          scheduler,
        ]
      properties:
        version: { type: string }
        now:
          type: integer
          description: Response delivery Unix milliseconds; equals read.servedAt when present, not a new observation time.
        read: { $ref: '#/components/schemas/StatusViewRead' }
        window: { type: string, enum: [24h, 7d] }
        retentionDays: { type: integer, const: 30 }
        cadenceSeconds: { type: integer, const: 60 }
        services:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Service' }
        incidents:
          type: array
          maxItems: 105
          description: All active open incidents, followed by the newest 100 active resolved incidents.
          items: { $ref: '#/components/schemas/Incident' }
        monitoring: { $ref: '#/components/schemas/MonitoringReadiness' }
        scheduler:
          type: array
          maxItems: 20
          items:
            type: object
            required: [at, slot, status, detail]
            properties:
              at: { type: integer, description: Unix milliseconds }
              slot: { type: integer }
              status: { type: string, enum: [started, completed, skipped-late] }
              detail: { $ref: '#/components/schemas/PublicSchedulerDetail' }
    CleanupBatch:
      type: object
      additionalProperties: false
      required: [limit, examined, deleted, protected, missing, mayRemain]
      description: FIFO candidates only. Deleted, protected and missing sum to examined; direct source deletions exclude trigger/index writes. Age expiry, expired-parent deletion, cold migration and account quota are excluded.
      properties:
        limit: { type: integer, const: 32 }
        examined: { type: integer, minimum: 0, maximum: 32 }
        deleted: { type: integer, minimum: 0, maximum: 32 }
        protected: { type: integer, minimum: 0, maximum: 32 }
        missing: { type: integer, minimum: 0, maximum: 32 }
        mayRemain:
          type: boolean
          description: True exactly when examined is 32. Conservative full-batch signal; neither a remaining-row count nor a claim that the queue is currently empty when false.
    PublicMetadataCleanup:
      type: object
      additionalProperties: false
      required: [schemaVersion, cutoff, versions]
      properties:
        schemaVersion: { type: integer, const: 1 }
        cutoff:
          { type: integer, minimum: 0, maximum: 8640000000000000, description: Unix milliseconds }
        versions: { $ref: '#/components/schemas/CleanupBatch' }
    MetadataCleanup:
      type: object
      additionalProperties: false
      required: [schemaVersion, cutoff, versions, orphanNotes]
      description: Authenticated audit projection only. Public status and exports omit orphan-note activity even when a valid operator token is supplied.
      properties:
        schemaVersion: { type: integer, const: 1 }
        cutoff:
          { type: integer, minimum: 0, maximum: 8640000000000000, description: Unix milliseconds }
        versions: { $ref: '#/components/schemas/CleanupBatch' }
        orphanNotes: { $ref: '#/components/schemas/CleanupBatch' }
    CleanupRecord:
      type: object
      additionalProperties: false
      required: [at, slot, cleanup]
      properties:
        at:
          {
            type: integer,
            minimum: 0,
            maximum: 8640000000000000,
            description: Completed run timestamp in Unix milliseconds,
          }
        slot:
          {
            type: integer,
            minimum: 0,
            maximum: 144000000000,
            description: Scheduled UTC minute since Unix epoch,
          }
        cleanup:
          oneOf:
            - $ref: '#/components/schemas/MetadataCleanup'
            - type: 'null'
          description: Null for legacy or invalid diagnostics; never fabricated zero counts. Cutoff cannot exceed at.
    PublicSchedulerDetail:
      type: object
      additionalProperties: false
      description: Allowlisted fields only. Started events have empty detail. Skipped-late may retain the known reason. Completed events may retain results and public cleanup; raw private note activity, IDs and bodies are excluded.
      properties:
        reason:
          type: string
          const: The scheduled minute has passed; a current probe cannot fill its historical gap.
        results:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [service, result]
            properties:
              service: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
              result:
                type: string
                enum:
                  [
                    good,
                    http-error,
                    timeout,
                    network-error,
                    invalid-body,
                    slow,
                    maintenance,
                    window-closed,
                    duplicate-or-busy,
                    superseded,
                    policy-changed,
                  ]
        cleanup:
          oneOf:
            - $ref: '#/components/schemas/PublicMetadataCleanup'
            - type: 'null'
          description: Optional on legacy completed events; null when present but malformed. This recorded result does not establish current cleanup or monitoring health.
    PolicyPatch:
      type: object
      additionalProperties: false
      description: Partial update; latencyObjectiveMs must not exceed timeoutMs after merging.
      properties:
        paused: { type: boolean }
        timeoutMs: { type: integer, minimum: 100, maximum: 10000 }
        latencyObjectiveMs: { type: integer, minimum: 50, maximum: 10000 }
        availabilityTarget:
          type: number
          minimum: 90
          maximum: 99.99
          description: Good-check objective, including validity and latency.
        failureThreshold: { type: integer, minimum: 1, maximum: 10 }
        recoveryThreshold: { type: integer, minimum: 1, maximum: 10 }
    Policy:
      allOf:
        - $ref: '#/components/schemas/PolicyPatch'
        - type: object
          required:
            [
              paused,
              timeoutMs,
              latencyObjectiveMs,
              availabilityTarget,
              failureThreshold,
              recoveryThreshold,
            ]
    Check:
      type: object
      required: [service, slot, at, outcome, status, latency, revision, observedAt]
      properties:
        service: { type: string }
        slot: { type: integer, description: Unix minute number }
        at: { type: integer, description: Completion Unix milliseconds }
        observedAt:
          type: [integer, 'null']
          description: Observation start Unix milliseconds. Null for legacy checks whose timing cannot be verified.
        outcome:
          {
            type: string,
            enum: [good, http-error, timeout, network-error, invalid-body, slow, maintenance],
          }
        status: { type: [integer, 'null'] }
        latency: { type: integer, minimum: 0 }
        revision: { type: integer }
    Incident:
      type: object
      required: [id, service, opened, resolved, acknowledged]
      properties:
        id: { type: string, format: uuid }
        service: { type: string }
        opened: { type: integer, description: Detection Unix milliseconds }
        resolved: { type: [integer, 'null'] }
        acknowledged: { type: [integer, 'null'] }
    IncidentPolicyVersion:
      type: object
      required: [service, revision, recordedAt, name, transport, assertion, policy, provenance]
      properties:
        service: { type: string }
        revision: { type: integer }
        recordedAt: { type: integer, description: Version capture Unix milliseconds }
        name: { type: string }
        transport: { type: string, enum: [origin, https] }
        assertion: { type: string, enum: [ok-json, catalog-json] }
        policy: { $ref: '#/components/schemas/Policy' }
        provenance:
          type: string
          enum: [recorded, recovered-current]
          description: recorded captures a creation/change; recovered-current captures the current policy during upgrade and does not establish its historical capture time.
    IncidentNote:
      type: object
      required: [id, at, note]
      properties:
        id: { type: string, format: uuid }
        at: { type: integer, description: Note creation Unix milliseconds }
        note: { type: string, minLength: 1, maxLength: 500 }
    IncidentNoteResponse:
      type: object
      required: [ok, note]
      properties:
        ok: { type: boolean, const: true }
        note: { $ref: '#/components/schemas/IncidentNote' }
        alreadyRecorded: { type: boolean, const: true }
    IncidentDetail:
      type: object
      required: [incident, checks, nextCursor, versions, range, lifecycle]
      properties:
        incident: { $ref: '#/components/schemas/Incident' }
        checks:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Check' }
        nextCursor:
          type: [integer, 'null']
          minimum: 0
          description: Exclusive before cursor for the next older page, or null at the end.
        versions:
          type: array
          description: Immutable versions for revisions on this page; unavailable revisions are omitted.
          items: { $ref: '#/components/schemas/IncidentPolicyVersion' }
        range:
          type: object
          required: [fromSlot, toSlot, retentionStart, limitedByRetention]
          properties:
            fromSlot:
              { type: integer, description: Inclusive earliest retained incident evidence minute }
            toSlot: { type: integer, description: Inclusive incident evidence end minute }
            retentionStart: { type: integer, description: Retention boundary Unix milliseconds }
            limitedByRetention: { type: boolean }
        lifecycle:
          type: array
          maxItems: 3
          items:
            type: object
            required: [action, at]
            properties:
              action:
                type: string
                enum: [incident.opened, incident.acknowledged, incident.recovered]
              at: { type: integer, description: Event Unix milliseconds }
        notes:
          type: array
          maxItems: 100
          description: Private progress/postmortem notes; present only with a valid operator credential.
          items: { $ref: '#/components/schemas/IncidentNote' }
        acknowledgementNote:
          type: string
          maxLength: 500
          description: Private original acknowledgement note; present only with a valid operator credential.
    BriefQuota:
      type: object
      required: [day, attempts, remaining, nextAllowedAt, pendingUntil]
      properties:
        day: { type: string, format: date }
        attempts: { type: integer, minimum: 0, maximum: 4 }
        remaining: { type: integer, minimum: 0, maximum: 4 }
        nextAllowedAt: { type: [integer, 'null'], description: Earliest next UTC minute start }
        pendingUntil: { type: [integer, 'null'], description: Current persisted dispatch deadline }
    BriefAdmission:
      type: object
      required:
        [
          day,
          recordsCreated,
          remaining,
          maxRecordsPerDay,
          retainedRecords,
          maxRetainedRecords,
          maxRecordBytes,
          upgradeDayClosed,
        ]
      properties:
        day: { type: string, format: date }
        recordsCreated:
          type: integer
          minimum: 0
          description: Reserved creations for the UTC day, without refunds. On a closed legacy upgrade day this is only a known lower bound.
        remaining: { type: integer, minimum: 0, maximum: 16 }
        maxRecordsPerDay: { type: integer, const: 16 }
        retainedRecords:
          type: integer
          minimum: 0
          description: Physical retained rows, including expired rows awaiting cron cleanup and grandfathered legacy records.
        maxRetainedRecords: { type: integer, const: 256 }
        maxRecordBytes:
          type: integer
          const: 131072
          description: UTF-8 serialized byte cap for new records, with completion headroom reserved before insertion. Older larger records are preserved.
        upgradeDayClosed:
          type: boolean
          description: New records are closed for the one-time migration UTC day because deleted legacy creation history cannot be reconstructed.
    BriefResponse:
      type: object
      required: [brief]
      properties:
        brief: { $ref: '#/components/schemas/BriefRecord' }
        alreadyRecorded: { type: boolean, const: true }
    BriefError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        brief: { $ref: '#/components/schemas/BriefRecord' }
        quota: { $ref: '#/components/schemas/BriefQuota' }
        admission: { $ref: '#/components/schemas/BriefAdmission' }
        code: { type: string, enum: [brief-record-limit, brief-record-size] }
        capability: { type: string, const: disabled }
    BriefRecord:
      type: object
      required:
        [
          requestId,
          incident,
          service,
          createdAt,
          completedAt,
          state,
          evidence,
          evidenceHash,
          evidenceSchemaVersion,
          promptVersion,
          model,
          promptEvidenceIds,
          omittedEvidenceCount,
          messageBytes,
          inputBytes,
          generated,
          failure,
        ]
      properties:
        requestId: { type: string, format: uuid }
        incident: { type: string, format: uuid }
        service: { type: string }
        createdAt: { type: integer }
        completedAt: { type: [integer, 'null'] }
        state:
          { type: string, enum: [pending, complete, failed, interrupted, insufficient-evidence] }
        evidence: { $ref: '#/components/schemas/BriefEvidence' }
        evidenceHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        evidenceSchemaVersion: { type: integer, const: 1 }
        promptVersion: { type: integer, const: 1 }
        model: { type: string, const: '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }
        promptEvidenceIds: { type: array, uniqueItems: true, items: { type: string } }
        omittedEvidenceCount: { type: integer, minimum: 0 }
        messageBytes: { type: integer, minimum: 0, maximum: 2048 }
        inputBytes: { type: integer, minimum: 0, maximum: 4096 }
        generated:
          oneOf:
            - $ref: '#/components/schemas/GeneratedBrief'
            - type: 'null'
        failure:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  {
                    type: string,
                    enum:
                      [
                        provider-unavailable,
                        provider-capacity,
                        provider-quota,
                        provider-auth,
                        timeout,
                        invalid-output,
                        evidence-limit,
                        interrupted,
                      ],
                  }
                message:
                  { type: string, description: Sanitized fixed message; no raw provider output }
            - type: 'null'
    GeneratedBrief:
      type: object
      additionalProperties: false
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [kind, explanation, evidenceIds, nextChecks]
            properties:
              kind:
                {
                  type: string,
                  enum:
                    [
                      upstream-http-error,
                      latency-or-timeout,
                      response-contract,
                      transport-failure,
                      evidence-gap,
                    ],
                }
              explanation: { type: string, minLength: 1, maxLength: 200 }
              evidenceIds:
                {
                  type: array,
                  minItems: 1,
                  maxItems: 3,
                  uniqueItems: true,
                  items: { type: string },
                  description: 'IDs actually included in the frozen prompt, with a relevant symptom for this kind',
                }
              nextChecks:
                {
                  type: array,
                  minItems: 1,
                  maxItems: 2,
                  uniqueItems: true,
                  items:
                    {
                      type: string,
                      enum:
                        [
                          inspect-service-logs,
                          compare-deployments,
                          verify-response-contract,
                          review-latency-and-timeout,
                          compare-policy-versions,
                          inspect-monitor-scheduler,
                        ],
                    },
                }
    BriefEvidence:
      type: object
      description: Frozen whitelisted public-safe evidence, independently hashed. Facts are computed by code; citations do not prove AI hypotheses.
      required:
        [
          schemaVersion,
          capturedAt,
          incident,
          range,
          checks,
          versions,
          lifecycle,
          facts,
          limits,
          references,
        ]
      properties:
        schemaVersion: { type: integer, const: 1 }
        capturedAt: { type: integer }
        incident: { $ref: '#/components/schemas/Incident' }
        range:
          type: object
          required: [fromSlot, toSlot, retentionStart, limitedByRetention]
          properties:
            fromSlot: { type: integer, minimum: 0 }
            toSlot: { type: integer, minimum: 0 }
            retentionStart: { type: integer }
            limitedByRetention: { type: boolean }
        checks:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: '#/components/schemas/Check'
              - type: object
                required: [service, id, timing]
                properties:
                  service: { type: string }
                  id: { type: string }
                  timing: { type: string, enum: [verified, legacy, invalid] }
        versions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/IncidentPolicyVersion'
              - type: object
                required: [id]
                properties:
                  id: { type: string }
        lifecycle:
          type: array
          maxItems: 3
          items:
            type: object
            required: [id, action, at]
            properties:
              id: { type: string }
              action:
                { type: string, enum: [incident.opened, incident.acknowledged, incident.recovered] }
              at: { type: integer }
        facts:
          type: object
          description: Deterministic counts and coverage strictly within the frozen selected slice; not full-incident or request availability.
          required:
            [
              recordedChecks,
              verifiedChecks,
              goodChecks,
              badChecks,
              maintenanceChecks,
              legacyChecks,
              invalidTimingChecks,
              missingMinutesWithinSlice,
              selectedFromSlot,
              selectedToSlot,
              finishedExpectedMinutesWithinSlice,
              finishedEligibleMinutesWithinSlice,
              verifiedCoveragePercentWithinFinishedSlice,
              outcomes,
            ]
          properties:
            recordedChecks: { type: integer, minimum: 0, maximum: 50 }
            verifiedChecks: { type: integer, minimum: 0, maximum: 50 }
            goodChecks: { type: integer, minimum: 0, maximum: 50 }
            badChecks: { type: integer, minimum: 0, maximum: 50 }
            maintenanceChecks: { type: integer, minimum: 0, maximum: 50 }
            legacyChecks: { type: integer, minimum: 0, maximum: 50 }
            invalidTimingChecks: { type: integer, minimum: 0, maximum: 50 }
            missingMinutesWithinSlice: { type: [integer, 'null'], minimum: 0 }
            selectedFromSlot: { type: [integer, 'null'], minimum: 0 }
            selectedToSlot: { type: [integer, 'null'], minimum: 0 }
            finishedExpectedMinutesWithinSlice: { type: [integer, 'null'], minimum: 0 }
            finishedEligibleMinutesWithinSlice: { type: [integer, 'null'], minimum: 0 }
            verifiedCoveragePercentWithinFinishedSlice:
              { type: [number, 'null'], minimum: 0, maximum: 100 }
            outcomes:
              type: object
              required: [good, http-error, timeout, network-error, invalid-body, slow, maintenance]
              properties:
                good: { type: integer, minimum: 0 }
                http-error: { type: integer, minimum: 0 }
                timeout: { type: integer, minimum: 0 }
                network-error: { type: integer, minimum: 0 }
                invalid-body: { type: integer, minimum: 0 }
                slow: { type: integer, minimum: 0 }
                maintenance: { type: integer, minimum: 0 }
        limits:
          type: object
          description: Explicit paging and sampling limits; no response bodies or private notes.
          required:
            [
              checkLimit,
              checksOmitted,
              olderPagesAvailable,
              limitedByRetention,
              missingPolicyRevisions,
              recoveredPolicyRevisions,
              includesCurrentMinute,
              measurement,
              responseBodiesAvailable,
              privateNotesIncluded,
            ]
          properties:
            checkLimit: { type: integer, const: 50 }
            checksOmitted: { type: integer, minimum: 0 }
            olderPagesAvailable: { type: boolean }
            limitedByRetention: { type: boolean }
            missingPolicyRevisions:
              { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
            recoveredPolicyRevisions:
              { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
            includesCurrentMinute: { type: boolean }
            measurement: { type: string, const: one-coordinator-sampled-checks }
            responseBodiesAvailable: { type: boolean, const: false }
            privateNotesIncluded: { type: boolean, const: false }
        references:
          type: array
          items:
            type: object
            required: [id, kind, label, detail, allowedKinds]
            properties:
              id: { type: string }
              kind: { type: string, enum: [check, policy, lifecycle, fact, limit] }
              label: { type: string }
              detail: { type: string, description: 'Frozen plain-text evidence, never executable' }
              allowedKinds: { type: array, items: { type: string } }
    BudgetSignalSnapshot:
      type: object
      required: [evaluation, evaluationStatus, lastFiring]
      description: |
        Latest persisted sampled-check evaluation and retained historical warning evidence.
        Only current evaluations establish present signal confidence: the stored revision must
        match the service policy, and evaluation age must be between zero and 180000 milliseconds
        inclusive. Stale or changed-policy results remain inspectable but cannot establish clearance.
        Reads never recompute an evaluation or renew its timestamp. Signals neither send external
        notifications nor open, acknowledge, or resolve monitoring incidents.
      properties:
        evaluation:
          oneOf:
            - $ref: '#/components/schemas/BurnRateEvaluation'
            - type: 'null'
        evaluationStatus:
          type: string
          enum: [current, stale, policy-changed, not-evaluated]
        lastFiring:
          description: Preserved through clear, insufficient evidence, maintenance, and policy changes. Null until a qualified rule first fires.
          oneOf:
            - $ref: '#/components/schemas/BudgetFiringEvidence'
            - type: 'null'
    BurnRateEvaluation:
      type: object
      required: [ruleVersion, revision, computedAt, state, highestFiring, rules]
      description: |
        Evaluates finished UTC minutes under the current policy revision, using at most the latest
        4320 minutes. Only checks with a verified observation timestamp in their scheduled minute
        count. Fixed paired thresholds use a 30-day sampled-check budget basis: rapid 60m/5m at
        14.4x, sustained 360m/30m at 6x, and gradual 4320m/360m at 1x. These are probe signals,
        not customer-request availability or geographically independent uptime measurements.
      properties:
        ruleVersion: { type: integer, const: 1 }
        revision: { type: integer, minimum: 1 }
        computedAt: { type: integer, description: Scheduled evaluation Unix milliseconds }
        state:
          type: string
          enum: [firing, clear, insufficient-evidence, maintenance]
        highestFiring:
          type: [string, 'null']
          enum: [rapid, sustained, gradual, null]
          description: Highest-priority qualified firing rule, or null. Priority is rapid, sustained, then gradual.
        rules:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/BurnRuleEvidence' }
    BurnRuleEvidence:
      type: object
      required: [id, name, long, short, threshold, state, reason]
      description: |
        Both windows must fall fully within the current policy's history, have at least 95% verified
        coverage, and contain at least twenty long-window and five short-window non-maintenance
        observations. A firing rule meets its threshold in both windows. Clear requires qualified
        evidence; unknown or immature windows produce insufficient-evidence instead.
      properties:
        id: { type: string, enum: [rapid, sustained, gradual] }
        name: { type: string }
        long: { $ref: '#/components/schemas/BurnWindowEvidence' }
        short: { $ref: '#/components/schemas/BurnWindowEvidence' }
        threshold: { type: number, minimum: 0 }
        state:
          type: string
          enum: [firing, clear, insufficient-evidence, maintenance]
        reason: { type: string }
    BurnWindowEvidence:
      type: object
      required:
        [
          minutes,
          startSlot,
          endSlot,
          expected,
          observed,
          good,
          bad,
          maintenance,
          unknown,
          coverage,
          burnRate,
          mature,
        ]
      properties:
        minutes: { type: integer, minimum: 1 }
        startSlot: { type: integer, description: Inclusive first Unix minute }
        endSlot: { type: integer, description: Inclusive last finished Unix minute }
        expected: { type: integer, minimum: 1 }
        observed: { type: integer, minimum: 0, description: Verified good plus bad observations }
        good: { type: integer, minimum: 0 }
        bad: { type: integer, minimum: 0 }
        maintenance: { type: integer, minimum: 0 }
        unknown:
          type: integer
          minimum: 0
          description: Missing, legacy, mistimed, or different-policy slots; no success credit.
        coverage:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Percentage of eligible minutes observed; maintenance is excluded from the denominator.
        burnRate:
          type: [number, 'null']
          minimum: 0
          description: Observed bad fraction divided by the evaluated policy's allowed bad fraction; null with no observations. Retained firing evidence keeps its original evaluation policy.
        mature:
          type: boolean
          description: Entire window starts at or after the first complete minute of the current policy.
    BudgetFiringEvidence:
      type: object
      required: [firstFiredAt, lastConfirmedAt, revision, rule, evidence, policyContext]
      description: |
        Last qualified highest-priority warning, retained even when later evidence cannot confirm
        its state. First-fired time continues only while the previous evaluation is current and
        firing under the same revision and highest rule. Clear, insufficient evidence, changed
        policy/rule, or stale evaluation starts a new confirmed interval on subsequent firing.
        These timestamps describe evaluations; they are not outage or incident timestamps.
        Captured policy context is self-contained and survives pruning of the original checks
        and policy-version rows. It never includes target URLs, credentials, headers, or private notes.
      properties:
        firstFiredAt:
          {
            type: integer,
            description: First evaluation Unix milliseconds in the confirmed interval,
          }
        lastConfirmedAt:
          { type: integer, description: Most recent qualified firing evaluation Unix milliseconds }
        revision: { type: integer, minimum: 1 }
        rule: { type: string, description: Retained firing rule identifier }
        evidence: { $ref: '#/components/schemas/BurnRuleEvidence' }
        policyContext:
          description: |
            Immutable public-safe policy version captured for the confirmed warning revision.
            Null for older serialized warnings whose context was not captured. Reads never guess
            context from the current configuration. A later matched firing confirmation may capture
            context while preserving the interval's first-fired time; this does not prove that context
            was available when an older warning first fired. Later policy edits do not replace it.
          oneOf:
            - $ref: '#/components/schemas/IncidentPolicyVersion'
            - type: 'null'
    Service:
      type: object
      required:
        [
          id,
          name,
          transport,
          assertion,
          createdAt,
          revision,
          policy,
          latest,
          status,
          state,
          budget,
          metrics,
          history,
          hourly,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string, enum: [origin, https] }
        assertion: { type: string, enum: [ok-json, catalog-json] }
        createdAt: { type: integer }
        revision: { type: integer }
        policy: { $ref: '#/components/schemas/Policy' }
        latest:
          oneOf:
            - $ref: '#/components/schemas/Check'
            - type: 'null'
        status: { type: string, enum: [healthy, degraded, incident, unknown, maintenance] }
        state:
          type: object
          properties:
            failures: { type: integer }
            successes: { type: integer }
            lastSlot: { type: [integer, 'null'] }
            incidentId: { type: [string, 'null'] }
        budget: { $ref: '#/components/schemas/BudgetSignalSnapshot' }
        metrics:
          type: object
          description: Finished minutes only; legacy checks without observedAt are unverified and excluded from observed/good/maintenance/P95. Null ratios when denominators are zero. Budget uses current target; outcomes use original policy.
          properties:
            total: { type: integer }
            observed: { type: integer }
            good: { type: integer }
            maintenance: { type: integer }
            unverified: { type: integer }
            expected: { type: integer }
            missing: { type: integer }
            coverage: { type: [number, 'null'] }
            goodRatio: { type: [number, 'null'] }
            p95Ms: { type: [number, 'null'] }
            budgetConsumed: { type: [number, 'null'] }
            windowStart: { type: integer }
            windowEnd: { type: integer }
        history:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/Check' }
        hourly:
          type: array
          items:
            type: object
            properties:
              at: { type: integer }
              total: { type: integer }
              good: { type: integer }
              maintenance: { type: integer }
              unverified: { type: integer }
