name: Verify EdgeLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0 # The build recipe reads a pinned historical client baseline without fetching.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test examples/counter-evidence/codec.test.mjs
      - run: node scripts/build-counter-inspector.mjs
      - run: node --test scripts/counter-inspector.test.mjs
      - run: node scripts/counter-portability.mjs
      - run: npm ci --prefix examples/subscription-evidence --ignore-scripts --no-audit --no-fund
      - run: npm --prefix examples/subscription-evidence test
      - run: node --test examples/subscription-server/server.test.mjs examples/subscription-server/paired.test.mjs
      - run: npm run test:client-build
      - run: npm run test:lifecycle
      - run: npm run test:async-lifetime
      - run: npm run test:lab-observer
      - run: node scripts/lab-observer-delivery.mjs
      - run: npm run test:lab-recording
      - run: npm run test:lab-storm
      - run: npm run test:lab-admission
      - run: npm run test:benchmark-compatibility
      - run: npm run test:monitor
      - run: npm run test:monitor-targets
      - run: npm run test:incident
      - run: npm run test:upgrade
      - run: npm run test:budget
      - run: npm run test:brief
      - run: npm run test:brief-evaluate
      - run: npm run test:examples
      - run: npm run test:check-cache
      - run: npm run test:monitor-unavailable
      - run: npm run test:retention
      - run: npm run test:retention-cost
      - run: npm run test:monitor-cost
      - run: npm run test:status-cache
      - run: npm run test:status-evidence
      - name: Test real local Worker and Durable Object
        run: |
          npm run dev:workers > /tmp/edgelab.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8787/api/health > /dev/null || { cat /tmp/edgelab.log; exit 1; }
          npm run test:assets || { cat /tmp/edgelab.log; exit 1; }
          npm run test:integration || { cat /tmp/edgelab.log; exit 1; }
