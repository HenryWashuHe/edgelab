name: Verify EdgeLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:lifecycle
      - run: npm run test:monitor
      - run: npm run test:incident
      - run: npm run test:upgrade
      - name: Test real local Worker and Durable Object
        run: |
          npm run dev:workers > /tmp/edgelab.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8787/api/health > /dev/null || { cat /tmp/edgelab.log; exit 1; }
          npm run test:integration || { cat /tmp/edgelab.log; exit 1; }
